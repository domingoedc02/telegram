name: Staging load test

# GitHub Actions CI is enabled again after the billing issue was fixed. This
# workflow remains manual until TG-8 provides a real tg-staging deployment and
# TG-16 provides infra/loadtest/soak.js; CI does not claim staging exists before
# those implementation issues land.
on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'tg-staging base URL to soak-test (set this when staging exists)'
        required: true

permissions:
  contents: read

jobs:
  load-test:
    name: k6 soak against tg-staging
    runs-on: ubuntu-latest
    env:
      STAGING_URL: ${{ inputs.staging_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for tg-staging to report ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent "${STAGING_URL}/readyz"; then
              echo "tg-staging is ready"
              exit 0
            fi
            echo "Waiting for tg-staging readiness ($i/30)..."
            sleep 10
          done
          echo "tg-staging did not become ready in time" >&2
          exit 1

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # infra/loadtest/soak.js is authored alongside TG-16 (real-time messaging),
      # since its thresholds (p95<500ms, WS error rate <1%) encode that story's
      # own NFRs. This job only wires the trigger/gate around it.
      - name: Run k6 soak (50 VUs, 10 min)
        run: k6 run infra/loadtest/soak.js --env TARGET="${STAGING_URL}"
