name: CI

# Revised 2026-10-01: decision/no-github-actions is superseded — the client's
# GitHub billing issue is fixed, so GitHub Actions CI is back on. Triggers run
# on every push/PR to main and on a v* tag, exactly as originally designed;
# workflow_dispatch stays as an extra, manual trigger. The local pnpm verify
# gate (ops/runbooks/local-verification.md) stays in place too — a green
# Actions run is now required in ADDITION to local verification before
# merging, not instead of it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/domingoedc02/telegram

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tg
          POSTGRES_PASSWORD: tg
          POSTGRES_DB: tg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg -d tg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tg:tg@localhost:5432/tg
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage'
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  build-image:
    name: Build image
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ env.GHCR_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # infra/docker/Dockerfile.app is created by TG-8 (production deploy on Dokploy).
      # This job's shape is reviewed now; it becomes end-to-end green once TG-8 merges.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.app
          tags: ${{ steps.tag.outputs.tag }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Scan
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - uses: docker/setup-buildx-action@v3
      - name: Re-build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.app
          tags: ${{ needs.build-image.outputs.image-tag }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image-tag }}
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  push:
    name: Push to GHCR
    if: github.event_name == 'push'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine extra tags
        id: extra-tags
        env:
          REF: ${{ github.ref }}
          SHA_TAG: ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          STAGING_TAG: ${{ env.GHCR_IMAGE }}:staging
          LATEST_TAG: ${{ env.GHCR_IMAGE }}:latest
        run: |
          tags="$SHA_TAG"
          if [ "$REF" = "refs/heads/main" ]; then
            tags="$tags,$STAGING_TAG"
          fi
          if [[ "$REF" == refs/tags/v* ]]; then
            tags="$tags,$LATEST_TAG"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.app
          push: true
          tags: ${{ steps.extra-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Real job: auto-deploys tg-staging on every merge to main (answer/environments-ci).
  # Gated on the repo *variable* `DOKPLOY_STAGING_READY` (not a secret — job-level
  # `if:` can only see the `vars` context, not `secrets`, per GitHub's own context
  # availability rules) so the run stays green (skipped, not failed) until TG-8
  # supplies the real Dokploy secrets and a human flips this variable to "true" —
  # see ops/runbooks/ci-pipeline-setup.md for exactly what to add and when.
  deploy-staging:
    name: Deploy to staging
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.DOKPLOY_STAGING_READY == 'true'
    needs: push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Call Dokploy deploy webhook (tg-staging)
        run: |
          curl --fail --silent --show-error -X POST \
            "${DOKPLOY_URL}/api/deploy/${DOKPLOY_STAGING_APP_ID}" \
            -H "Authorization: Bearer ${DOKPLOY_API_TOKEN}"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_STAGING_APP_ID: ${{ secrets.DOKPLOY_STAGING_APP_ID }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}

  # Real job: gated by the "production" GitHub Environment's required reviewers
  # (manual approval, configured once in repo Settings -> Environments, see
  # Setup & config) AND by the repo variable `DOKPLOY_PROD_READY`, same
  # reasoning as deploy-staging above.
  deploy-prod:
    name: Deploy to production
    if: startsWith(github.ref, 'refs/tags/v') && vars.DOKPLOY_PROD_READY == 'true'
    needs: push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call Dokploy deploy webhook (tg-prod)
        run: |
          curl --fail --silent --show-error -X POST \
            "${DOKPLOY_URL}/api/deploy/${DOKPLOY_PROD_APP_ID}" \
            -H "Authorization: Bearer ${DOKPLOY_API_TOKEN}"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_PROD_APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
